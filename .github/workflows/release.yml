name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-22.04
    outputs:
      release_sha: ${{ steps.resolve_tag.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Resolve release tag to immutable commit
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          git check-ref-format "${tag_ref}"
          git fetch --force --no-tags origin "${tag_ref}:${tag_ref}"
          release_sha="$(git rev-parse --verify "${tag_ref}^{commit}")"
          test "$(git rev-parse HEAD)" = "${release_sha}"
          printf 'release_sha=%s\n' "${release_sha}" >> "${GITHUB_OUTPUT}"
      - name: Verify release tag and versions
        run: npm run check:release-version -- "${RELEASE_TAG}"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf ripgrep
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit
      - name: Run release gate
        run: ./scripts/verify-local.sh

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            signing_identity: '-'
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            signing_identity: '-'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
            signing_identity: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
            signing_identity: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.quality.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag still matches immutable commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          git fetch --force --no-tags origin "${tag_ref}:${tag_ref}"
          current_sha="$(git rev-parse --verify "${tag_ref}^{commit}")"
          test "${current_sha}" = "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signing_identity }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: '900API ${{ env.RELEASE_TAG }}'
          releaseBody: 'See CHANGELOG.md for release notes and docs/PUBLIC_RELEASE.md for installation guidance.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  checksums:
    needs: [quality, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.quality.outputs.release_sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag before asset download
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          git fetch --force --no-tags origin "${tag_ref}:${tag_ref}"
          current_sha="$(git rev-parse --verify "${tag_ref}^{commit}")"
          test "${current_sha}" = "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${RELEASE_TAG}" --dir release-assets
      - name: Validate release artifact set
        run: npm run validate:release-assets -- release-assets "${RELEASE_TAG}"
      - name: Create SHA-256 checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Verify release tag before checksum upload
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.quality.outputs.release_sha }}
        run: |
          set -euo pipefail
          tag_ref="refs/tags/${RELEASE_TAG}"
          git fetch --force --no-tags origin "${tag_ref}:${tag_ref}"
          current_sha="$(git rev-parse --verify "${tag_ref}^{commit}")"
          test "${current_sha}" = "${RELEASE_SHA}"
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" release-assets/SHA256SUMS.txt --clobber
