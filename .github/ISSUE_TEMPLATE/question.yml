name: Usage question
description: Ask how to complete a workflow with 900API
title: "[Question]: "
labels:
  - question
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include sanitized examples and error text.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 900API version and platform
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private URLs, personal paths, and customer data.
          required: true
