[package]
name = "api900"
version = "0.1.1"
description = "API testing and documentation client — a Postman alternative that respects your privacy"
authors = ["900 Labs"]
license = "MIT"
repository = "https://github.com/900Labs/900API"
edition = "2021"
rust-version = "1.88"

[lib]
name = "api900_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "multipart", "stream", "rustls-tls", "http2"], default-features = false }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
url = "2"
boa_engine = "0.20"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
dirs = "6"
